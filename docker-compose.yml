services:
  api:
    build: .
    container_name: noah_api
    environment:
      UVICORN_APP: "app.main:app"
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "9010"
    ports:
      - "9010:9010"
    volumes:
      - ./logs:/app/logs
      - ./config.yml:/app/config.yml:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    build: .
    container_name: noah_admin
    command: ["python","-m","streamlit","run","ui/app.py","--server.address=0.0.0.0","--server.port=8501"]
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config.yml:/app/config.yml:rw

  watchdog:
    build: .
    container_name: noah_watchdog
    command: ["python","-m","src.utils.health_watchdog"]
    environment:
      WATCH_URL: "http://api:9010/health"
      WATCH_PERIOD_SEC: "30"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO}"
    depends_on:
      api:
        condition: service_started

# Optional: set project name
name: noah_stack
